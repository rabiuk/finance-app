<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Finance</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#EDF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F15" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design: Claude Design handoff "Block, calm" (direction 2a, periwinkle). Tokens below are the handoff's sRGB values. */
:root {
  --bg: #EDF0F7; --surface: #FFFFFF; --line: #DEE1EA; --line2: #C0C4CE; --track: #E4E8F0;
  --ink: #171A24; --ink2: #5E636F; --ink3: #818691;
  --hbg: #181D27; --hline: #181D27; --hink: #F3F5F9; --hink2: #A9AEB8; --htrack: #303541; --hout: #585D6A; --hacc: #A2BAFF; --hring: rgba(255,255,255,.14);
  --barok: #5E78D9; --accT: #3C52B6; --accSoft: #E3EAFB; --pos: #3C52B6; --posTint: #E3EAFB; --good: #1E9E57; --goodTint: #DDF3E5;
  --red: #C4513B; --redT: #AE422D; --amber: #9A6A0E; --amberT: #83590A; --green: #2E9052; --greenT: #10703A;
  --tabOn: #E3E8F3; --bar: rgba(255,255,255,.97);
  --c1: #A2BAFF; --c2: #6676A5; --c3: #404A67; --c4: #A9AEB8;
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F15; --surface: #171920; --line: #25282F; --line2: #373A43; --track: #25282F;
    --ink: #F0F2F6; --ink2: #A3A8B2; --ink3: #797D87;
    --hbg: #171920; --hline: #282B34; --hink: #F3F5F9; --hink2: #A3A8B2; --htrack: #282B34; --hout: #535864; --hacc: #A2BAFF;
    --barok: #A2BAFF; --accT: #A2BAFF; --accSoft: #2A303F; --pos: #A2BAFF; --posTint: #2A303F; --good: #7ED9A0; --goodTint: #1F3328;
    --red: #F08A76; --redT: #F49B89; --amber: #E8BA67; --amberT: #EDC47E; --green: #77D199; --greenT: #8EE0AB;
    --tabOn: #31353F; --bar: rgba(35,38,46,.97);
    --c1: #A2BAFF; --c2: #6575A1; --c3: #3E4761; --c4: #A3A8B2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F15; --surface: #171920; --line: #25282F; --line2: #373A43; --track: #25282F;
  --ink: #F0F2F6; --ink2: #A3A8B2; --ink3: #797D87;
  --hbg: #171920; --hline: #282B34; --hink: #F3F5F9; --hink2: #A3A8B2; --htrack: #282B34; --hout: #535864; --hacc: #A2BAFF;
  --barok: #A2BAFF; --accT: #A2BAFF; --accSoft: #2A303F; --pos: #A2BAFF; --posTint: #2A303F; --good: #7ED9A0; --goodTint: #1F3328;
  --red: #F08A76; --redT: #F49B89; --amber: #E8BA67; --amberT: #EDC47E; --green: #77D199; --greenT: #8EE0AB;
  --tabOn: #31353F; --bar: rgba(35,38,46,.97);
  --c1: #A2BAFF; --c2: #6575A1; --c3: #3E4761; --c4: #A3A8B2;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); touch-action: manipulation; } /* no double-tap zoom */
html { zoom: 0.9; } /* whole app 10% smaller: text, spacing, and bars stay in proportion */
button, .tabs, .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body {
  color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 600; line-height: 1.3;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums;
}
.screen {
  max-width: 480px; margin: 0 auto;
  padding: calc(8px + env(safe-area-inset-top, 0px)) env(safe-area-inset-right, 0px) calc(130px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--barok); outline-offset: 2px; }

/* Header */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 22px 16px; }
.head .eyebrow { font-size: 15px; font-weight: 600; color: var(--ink2); }
.head h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.2; }
.tools { display: flex; gap: 8px; flex: none; margin-bottom: 4px; }
.tool { width: 44px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); color: var(--ink2); display: grid; place-items: center; }
.tool svg { width: 20px; height: 20px; }
.tool.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero */
.hero { margin: 0 12px; background: var(--hbg); color: var(--hink); border: 1px solid var(--hline); border-radius: 30px; padding: 22px; }
.hero .eb { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hacc); }
.hero .num { font-weight: 800; line-height: 0.95; letter-spacing: -0.065em; }
.hero .num.b { font-size: 100px; margin: 8px 0 0 -4px; }
.hero .num.n { font-size: 76px; margin: 8px 0 0 -3px; }
.hero .num.neg { color: #F08A76; }
.hero .sub2 { display: flex; align-items: baseline; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.hero .sub2 b { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; color: var(--hacc); }
.hero .sub2 span { font-size: 17px; font-weight: 600; color: var(--hink2); }
.hero .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; color: var(--hink2); margin-top: 10px; }
.hero .meta span { white-space: nowrap; }
.pace { position: relative; height: 12px; border-radius: 6px; background: var(--htrack); margin-top: 20px; overflow: hidden; }
.pace i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--hacc); }
.pace i.over { background: #F08A76; }
.pace u { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--hbg); }

/* Status chips */
.chips { display: flex; gap: 8px; padding: 12px 12px 0; }
.chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 700; }
.chip b { font-weight: 800; }
.chip.over { background: color-mix(in oklch, var(--red) 14%, var(--bg)); border: 1px solid color-mix(in oklch, var(--red) 28%, transparent); color: var(--redT); }
.chip.near { background: color-mix(in oklch, var(--amber) 16%, var(--bg)); border: 1px solid color-mix(in oklch, var(--amber) 28%, transparent); color: var(--amberT); }
.chip.ok { flex: 1.3; background: color-mix(in oklch, var(--green) 14%, var(--bg)); border: 1px solid color-mix(in oklch, var(--green) 30%, transparent); color: var(--greenT); }

/* Sections + groups */
.sec { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 30px 22px 12px; }
.sec h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; }
.sec h2.muted { color: var(--ink2); }
.sec span { font-size: 14px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.sec span.strong { font-size: 15px; font-weight: 700; }
.group { margin: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 4px 18px; overflow: hidden; }
.group.dashed { background: none; border: 2px dashed var(--line2); padding: 0 18px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 68px; margin-bottom: -1px; border-bottom: 1px solid var(--line); }
.row .l { min-width: 0; }
.row .t { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 14px; font-weight: 600; color: var(--ink2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .a { font-size: 17px; font-weight: 800; white-space: nowrap; flex: none; }
.row .a small { font-size: 17px; font-weight: 600; color: var(--ink2); }
.note { padding: 10px 22px 0; font-size: 13px; font-weight: 600; color: var(--ink3); }

/* Category rows */
.cat { padding: 14px 0 16px; margin-bottom: -1px; border-bottom: 1px solid var(--line); }
.cat .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat .nm { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .st { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.cat .bar { position: relative; height: 10px; border-radius: 5px; background: var(--track); margin-top: 10px; }
.cat .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.cat .bar u { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; border-radius: 1.5px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.cat .bot { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; color: var(--ink2); margin-top: 8px; }
.c-over { color: var(--red); } .c-near { color: var(--amber); }
.f-over { background: var(--red); } .f-near { background: var(--amber); } .f-ok { background: var(--barok); }

/* Tappable rows */
.tap { display: block; width: 100%; text-align: left; border-radius: 0; }
.tap:active { opacity: .6; }
.chev { width: 8px; height: 13px; flex: none; color: var(--ink3); margin-left: 2px; }
.cat .top .r { display: flex; align-items: center; gap: 8px; }

/* Purchases sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,10,16,.45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .22s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 480px; margin: 0 auto; max-height: 88vh; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 30px 30px 0 0; border: 1px solid var(--line); border-bottom: 0;
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 8px auto 0; flex: none; }
.sheet .sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 22px 4px; flex: none; touch-action: none; }
.sheet .sh-head h3 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.sheet .sh-head p { font-size: 15px; font-weight: 600; color: var(--ink2); margin-top: 2px; }
.sheet .sh-bar { margin: 12px 22px 0; flex: none; }
.sheet .seg { display: flex; gap: 4px; margin: 16px 12px 12px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; flex: none; }
.sheet .seg button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--ink3); }
.sheet .seg button[aria-pressed="true"] { background: var(--tabOn); color: var(--ink); }
.sheet .sh-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 24px; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accT); background: var(--accSoft); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 1px; }

/* Activity */
.day { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 24px 22px 10px; }
.day .d { display: flex; align-items: baseline; gap: 8px; }
.day .d b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.day .d span, .day .tot { font-size: 14px; font-weight: 600; color: var(--ink2); }
.day .tot { font-size: 15px; font-weight: 700; }
.tx { display: flex; align-items: center; gap: 14px; min-height: 68px; margin-bottom: -1px; border-bottom: 1px solid var(--line); }
.av { width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--accSoft); color: var(--accT); display: grid; place-items: center; font-size: 16px; font-weight: 800; }
.tx .mid { flex: 1; min-width: 0; }
.tx .m { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .x { font-size: 13px; font-weight: 600; color: var(--ink2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font-size: 16px; font-weight: 800; white-space: nowrap; }
.tx .amt.in { color: var(--pos); }

/* Trends */
.tn { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.tn b { font-size: 48px; font-weight: 800; letter-spacing: -0.055em; line-height: 1; color: var(--hacc); }
.tn b.neg { color: #F08A76; }
.tn span { font-size: 15px; font-weight: 600; color: var(--hink2); }
.stats { display: flex; gap: 24px; margin-top: 16px; }
.stats .k { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--hink2); }
.stats .k i { width: 8px; height: 8px; border-radius: 4px; }
.stats .v { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.chart { height: 170px; display: flex; align-items: flex-end; gap: 5px; margin-top: 22px; }
.chart .m { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; gap: 2px; }
.chart .m i { flex: 1; border-radius: 4px; min-height: 2px; }
.mlab { display: flex; gap: 5px; margin-top: 8px; }
.mlab span { flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--hink2); }
.pill { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 15px; font-weight: 800; }
.pill.pos { background: var(--posTint); color: var(--pos); }
.pill.neg { background: color-mix(in oklch, var(--red) 14%, transparent); color: var(--red); }
.pill.wait { background: color-mix(in oklch, var(--amber) 16%, transparent); color: var(--amber); }
.pill.sm { height: 28px; font-size: 13px; padding: 0 10px; }
.row .a.paid { display: flex; align-items: center; gap: 6px; }
.ok-ic { width: 18px; height: 18px; flex: none; color: var(--good); }
.pill.good { background: var(--goodTint); color: var(--good); }
.hero .num.st { font-size: 64px; margin: 10px 0 0 -2px; letter-spacing: -0.05em; }
.hero .num.warn { color: #F2C46D; }
.hero .num.good { color: #7ED9A0; }
/* Collapsible card (Rent & bills) */
.acc-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 76px; text-align: left; }
.acc-h .t { font-size: 17px; font-weight: 700; }
.acc-h .s { font-size: 14px; font-weight: 600; color: var(--ink2); margin-top: 2px; }
.acc-h .tot { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.acc-h .chev { transition: transform .28s ease; }
.acc.open .acc-h .chev { transform: rotate(90deg); }
.acc-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.acc.open .acc-b { grid-template-rows: 1fr; }
.acc-b > div { overflow: hidden; min-height: 0; }
.acc-b .row:first-child { border-top: 1px solid var(--line); }
.acc-b .row:last-child { border-bottom: 0; margin-bottom: 0; }

/* Net worth */
.comp { display: flex; gap: 3px; height: 16px; margin-top: 20px; }
.comp i { height: 100%; border-radius: 5px; min-width: 4px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin-top: 16px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 5px; flex: none; box-shadow: inset 0 0 0 1px var(--hring); }
.legend span { color: var(--hink2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend b { font-weight: 800; }

/* Tab bar */
.fade { position: fixed; left: 0; right: 0; bottom: 0; height: calc(120px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 62%); z-index: 2; pointer-events: none; }
.tabs {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) - 8px)); height: 64px; border-radius: 32px;
  background: var(--bar); border: 1px solid var(--line); z-index: 3; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  box-shadow: 0 12px 30px -12px rgba(0,0,0,.4); max-width: 456px; margin: 0 auto;
}
.tab { flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink3); }
.tab svg { width: 24px; height: 24px; }
.tab span { font-size: 10px; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--tabOn); color: var(--ink); }

/* States */
.sk { margin: 0 12px 12px; height: 70px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.sk.hero-sk { height: 250px; border-radius: 30px; background: var(--hbg); border-color: var(--hline); }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(128,136,160,.12), transparent); transform: translateX(-100%); animation: sh 1.3s infinite; }
@keyframes sh { to { transform: translateX(100%); } }
.msg { margin: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 20px 18px; }
.msg b { display: block; font-size: 17px; font-weight: 800; margin-bottom: 4px; }
.msg p { font-size: 15px; color: var(--ink2); }
.msg button { margin-top: 14px; height: 44px; padding: 0 18px; border-radius: 22px; background: var(--hbg); color: var(--hink); font-weight: 700; }
.tip { margin: 0 12px 12px; background: var(--accSoft); border-radius: 22px; padding: 12px 8px 12px 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.tip span { flex: 1; }
.tip button { width: 44px; height: 44px; flex: none; color: var(--ink2); font-size: 20px; font-weight: 700; }
.empty { padding: 20px 0; font-size: 15px; color: var(--ink2); }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 18px; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 6; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="head"><div><div class="eyebrow">&nbsp;</div><h1>Budget</h1></div></div>
  <div class="sk hero-sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
</main>
<div class="fade"></div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="budget" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg><span>Budget</span></button>
  <button class="tab" role="tab" data-tab="activity" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5.5" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="15.9" width="10" height="2.6" rx="1.3"/></svg><span>Activity</span></button>
  <button class="tab" role="tab" data-tab="home" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-5.5h5v5.5" fill="currentColor"/></svg><span>Home</span></button>
  <button class="tab" role="tab" data-tab="trends" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="4.2" height="8" rx="1.5"/><rect x="9.9" y="5" width="4.2" height="15" rx="1.5"/><rect x="15.8" y="9" width="4.2" height="11" rx="1.5"/></svg><span>Trends</span></button>
  <button class="tab" role="tab" data-tab="worth" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="3.5" stroke="currentColor" stroke-width="2.4"/><rect x="3.5" y="10.3" width="17" height="2.4" fill="currentColor"/></svg><span>Net worth</span></button>
</nav>
<div class="toast" id="toast" role="status"></div>
<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Purchases" aria-hidden="true"></section>

<script>
// ---------------------------------------------------------------- Setup
// The page holds no data. It asks the "Finance dashboard" Apps Script for it with the
// private key from the setup link (#k=...). The key lives in this page's address and
// this phone's storage, never in the page code.
var API = 'https://script.google.com/macros/s/AKfycbzSezKO-7wbXo6rw5nBoRfAnb45brEdhQOEAmGll3vVWLUXfkO2bxgfmyWYia8Yjp3U/exec';
var DATA = null, TAB = 'budget', LOADING = false;
var NEAR_AT = 0.8; // Same threshold as the "Near cap" budget alert.
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON = MONTHS.map(function (m) { return m.slice(0, 3); });
var WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(n, cents) {
  var v = Number(n) || 0;
  return '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
}
function signed(n, cents) { return (n < 0 ? '−' : n > 0 ? '+' : '') + money(n, cents); }
function pctW(x) { return Math.max(0, Math.min(100, x * 100)).toFixed(1) + '%'; }
function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }

// ---------------------------------------------------------------- Budget
function statusOf(r) { if (r.actual > r.cap) return 'over'; if (r.actual >= NEAR_AT * r.cap) return 'near'; return 'ok'; }
function viewBudget() {
  var c = DATA.caps || { rows: [] }, t = today();
  var day = t.getDate(), days = daysIn(t.getFullYear(), t.getMonth());
  var parts = String(c.month || '').split('-').map(Number);
  if (parts.length === 2 && (parts[0] !== t.getFullYear() || parts[1] !== t.getMonth() + 1)) {
    days = daysIn(parts[0], parts[1] - 1); day = Math.round((c.monthGonePct || 0) / 100 * days);
  }
  var daysLeft = Math.max(0, days - day), tick = day / days;
  var rows = c.rows || [];
  var flex = rows.filter(function (r) { return r.cap > 0 && !/joint/i.test(r.category); });
  var fixed = rows.filter(function (r) { return r.cap > 0 && /joint/i.test(r.category); });
  var nocap = rows.filter(function (r) { return !(r.cap > 0) && Math.abs(r.actual) >= 0.5; }).sort(function (a, b) { return b.actual - a.actual; });
  var spent = 0, cap = 0; flex.forEach(function (r) { spent += r.actual; cap += r.cap; });
  var left = cap - spent, perDay = daysLeft > 0 && left > 0 ? Math.round(left / daysLeft) : 0;
  var rank = { over: 0, near: 1, ok: 2 };
  flex.forEach(function (r) { r.st = statusOf(r); r.p = r.actual / r.cap; });
  flex.sort(function (a, b) { return rank[a.st] - rank[b.st] || (a.st === 'over' ? (b.actual - b.cap) - (a.actual - a.cap) : b.p - a.p); });
  var n = { over: 0, near: 0, ok: 0 }; flex.forEach(function (r) { n[r.st]++; });

  var h = head(longDate(t), 'Budget');
  h += '<section class="hero"><div class="eb">' + (left >= 0 ? 'Left in your caps' : 'Over your caps') + '</div>' +
    '<div class="num b' + (left < 0 ? ' neg' : '') + '" style="' + fit(money(left), 100, 5) + '">' + money(left) + '</div>' +
    '<div class="sub2">' + (left > 0 && daysLeft > 0
      ? '<b>' + money(perDay) + '</b><span>a day for ' + daysLeft + ' more day' + (daysLeft === 1 ? '' : 's') + '</span>'
      : left > 0 ? '<span>Last day of ' + MONTHS[t.getMonth()] + '</span>'
      : '<span>Hold off for ' + daysLeft + ' more day' + (daysLeft === 1 ? '' : 's') + '</span>') + '</div>' +
    '<div class="pace"><i class="' + (left < 0 ? 'over' : '') + '" style="width:' + pctW(cap ? spent / cap : 0) + '"></i><u style="left:' + pctW(tick) + '"></u></div>' +
    '<div class="meta"><span>' + money(spent) + ' of ' + money(cap) + '</span><span>Day ' + day + ' of ' + days + '</span></div></section>';
  h += '<div class="chips">' +
    '<div class="chip over"><b>' + n.over + '</b><span>over</span></div>' +
    '<div class="chip near"><b>' + n.near + '</b><span>near</span></div>' +
    '<div class="chip ok"><b>' + n.ok + '</b><span>on track</span></div></div>';

  h += sec('Categories', DATA.txns ? 'Tap to see purchases' : 'Most urgent first') + '<div class="group">';
  flex.forEach(function (r) {
    var diff = r.cap - r.actual;
    h += '<button class="cat tap" data-cat="' + esc(r.category) + '"><div class="top"><div class="nm">' + esc(r.category) + '</div>' +
      '<div class="r"><div class="st ' + (r.st === 'ok' ? '' : 'c-' + r.st) + '">' + money(diff) + (diff < 0 ? ' over' : ' left') + '</div>' + CHEV + '</div></div>' +
      '<div class="bar"><i class="f-' + r.st + '" style="width:' + pctW(r.p) + '"></i><u style="left:' + pctW(tick) + '"></u></div>' +
      '<div class="bot"><span>' + money(r.actual) + ' of ' + money(r.cap) + '</span><span>' + Math.round(r.p * 100) + '%</span></div></button>';
  });
  if (!flex.length) h += '<div class="empty">No caps set yet. Add caps on the Goals tab of the sheet.</div>';
  h += '</div>';

  h += myBillsHtml(c.month);

  if (nocap.length) {
    var tot = nocap.reduce(function (s, r) { return s + r.actual; }, 0);
    h += sec('No cap', money(tot) + ' so far') + '<div class="group" style="padding:0 18px">';
    nocap.forEach(function (r) {
      h += '<button class="row tap" style="min-height:66px;display:flex" data-cat="' + esc(r.category) + '"><div class="l"><div class="t">' + esc(r.category) + '</div><div class="s">This month</div></div><div style="display:flex;align-items:center;gap:8px"><div class="a">' + money(r.actual) + '</div>' + CHEV + '</div></button>';
    });
    h += '</div>';
  }
  return h;
}

// My bills: Kenny's own monthly bills from the Recurring tab (rows with a Due day and a Match).
// A bill counts as paid when a purchase this month matches its Match text.
var MYBILLS_OPEN = false; try { MYBILLS_OPEN = localStorage.getItem('myBillsOpen') === '1'; } catch (e) {}
function myBillsHtml(month) {
  var B = DATA.bills, tx = DATA.txns || [], t = today();
  if (!B || !B.length) return '';
  var ym = /^\d{4}-\d{2}$/.test(month || '') ? month : t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2);
  var cur = ym === t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2);
  var list = B.map(function (b) {
    var re = null; try { re = new RegExp(b.match, 'i'); } catch (e) {}
    var hits = re ? tx.filter(function (x) { return x.amt < 0 && re.test(x.desc); }) : [];
    var paidAmt = -hits.reduce(function (s, x) { return s + x.amt; }, 0);
    var last = hits.reduce(function (m, x) { return x.iso > m ? x.iso : m; }, '');
    var dueIso = ym + '-' + ('0' + Math.min(b.due, 28)).slice(-2);
    return { name: b.name, amount: b.amount, due: b.due, dueIso: dueIso, paid: hits.length > 0, paidAmt: paidAmt, paidIso: last,
             late: !hits.length && (!cur || t.getDate() > b.due) };
  }).sort(function (a, b) { return a.due - b.due; });
  var total = list.reduce(function (s, b) { return s + (b.paid ? b.paidAmt : b.amount); }, 0);
  var nPaid = list.filter(function (b) { return b.paid; }).length;
  var toPay = list.reduce(function (s, b) { return s + (b.paid ? 0 : b.amount); }, 0);
  var h = sec('My bills', 'This month') +
    '<div class="group acc' + (MYBILLS_OPEN ? ' open' : '') + '" id="myBillsAcc"><button class="acc-h tap" id="myBillsBtn" aria-expanded="' + MYBILLS_OPEN + '" aria-controls="myBillsBody">' +
    '<div class="l"><div class="t">Total</div><div class="s">' + nPaid + ' of ' + list.length + ' paid' + (toPay > 0 ? ' · ' + money(toPay) + ' to go' : '') + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:8px"><div class="tot">' + money(total) + '</div>' + CHEV + '</div></button>' +
    '<div class="acc-b" id="myBillsBody"><div>';
  list.forEach(function (b) {
    var s = b.paid ? 'Paid ' + niceDay(b.paidIso) : b.late ? 'Not seen yet · due ' + niceDay(b.dueIso) : 'Due ' + niceDay(b.dueIso);
    h += '<div class="row"><div class="l"><div class="t">' + esc(b.name) + '</div><div class="s">' + esc(s) + '</div></div>' +
      '<div class="a' + (b.paid ? ' paid' : '') + '">' + (b.paid ? ICON_OK : '') + money(b.paid ? b.paidAmt : b.amount, true) + '</div></div>';
  });
  h += '</div></div></div><div class="note">From checking 5321. Bank withdrawals show after the Sunday import.</div>';
  return h;
}

// ---------------------------------------------------------------- Home (joint plan with Taiwo)
// Everything here comes from the Joint tab, which the alert script updates every 5 minutes.
var ICON_OK = '<svg class="ok-ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.2" stroke-width="2"/><path d="M6.3 10.3l2.4 2.4 5-5.2"/></svg>';
var JCARD = '__jointcard';
var BILLS_OPEN = false; try { BILLS_OPEN = localStorage.getItem('billsOpen') === '1'; } catch (e) {}
function who(w) { return w === 'Kenny' ? 'You' : w; }
function viewHome() {
  var J = DATA.joint, t = today();
  if (!J || !J.bills) return head('Joint with Taiwo', 'Home') + '<div class="msg"><b>The joint plan is not ready yet</b><p>The Joint tab of the sheet fills in within 5 minutes.</p></div>';
  var h = head('Joint with Taiwo', 'Home');

  // Joint check
  var st = J.status, big, sub, cls = '';
  if (st === 'covered') { big = 'Covered'; cls = ' good'; sub = '<b>' + money(J.projection) + '</b><span>left after everything due by ' + niceDay(J.horizonEnd) + '</span>'; }
  else if (st === 'short') { big = 'Short'; cls = ' neg'; sub = '<b style="color:#F08A76">' + money(J.projection) + '</b><span>short for bills due by ' + niceDay(J.horizonEnd) + ', even after both deposits</span>'; }
  else if (st === 'overdrawn') { big = 'Overdrawn'; cls = ' neg'; sub = '<span>Waiting on ' + J.late.map(function (w) { return w === 'Kenny' ? 'your' : w + '’s'; }).join(' and ') + ' deposit</span>'; }
  else { big = 'Waiting'; cls = ' warn'; sub = '<span>On ' + J.late.map(function (w) { return w === 'Kenny' ? 'your' : w + '’s'; }).join(' and ') + ' deposit (due ' + niceDay(J.depositDue) + ')</span>'; }
  h += '<section class="hero"><div class="eb">Joint check</div><div class="num st' + cls + '">' + big + '</div>' +
    '<div class="sub2">' + sub + '</div>' +
    '<div class="meta"><span>Joint now ' + (J.balance < 0 ? '−' : '') + money(J.balance) + '</span><span>Bank data through ' + niceDay(J.dataThrough || J.balanceAsOf) + '</span></div></section>';

  // Deposits
  h += sec('Deposits for ' + J.depositMonth, 'Due ' + niceDay(J.depositDue)) + '<div class="group">';
  J.deposits.forEach(function (d) {
    var late = !d.done && J.today > J.depositDue;
    h += '<div class="row"><div class="l"><div class="t">' + esc(who(d.who)) + '</div><div class="s">' +
      (d.done ? money(d.received) + ' in · ' + niceDay(d.dates[d.dates.length - 1]) : d.received > 0 ? money(d.received) + ' of ' + money(d.target) + ' in' : money(d.target) + ' due ' + niceDay(J.depositDue)) + '</div></div>' +
      '<div class="pill sm ' + (d.done ? 'good' : late ? 'neg' : 'wait') + '">' + (d.done ? 'In' : late ? 'Late' : 'Not in yet') + '</div></div>';
  });
  h += '</div>';

  // Rent & bills: one card with the month's total. Tap to open the list.
  var all = J.bills.concat([J.cardBill]);
  var total = all.reduce(function (s, b) { return s + (b.paid ? b.paidAmt : b.amount); }, 0);
  var nPaid = all.filter(function (b) { return b.paid; }).length;
  h += sec('Rent & bills', 'This month') +
    '<div class="group acc' + (BILLS_OPEN ? ' open' : '') + '" id="billsAcc"><button class="acc-h tap" id="billsBtn" aria-expanded="' + BILLS_OPEN + '" aria-controls="billsBody">' +
    '<div class="l"><div class="t">Total</div><div class="s">Your half ' + money(total * J.share) + ' · ' + nPaid + ' of ' + all.length + ' paid</div></div>' +
    '<div style="display:flex;align-items:center;gap:8px"><div class="tot">' + money(total) + '</div>' + CHEV + '</div></button>' +
    '<div class="acc-b" id="billsBody"><div>';
  all.forEach(function (b) {
    var s;
    if (b.paid) s = 'Paid ' + niceDay(b.paidIso);
    else if (b.late) s = 'Not seen yet · due ' + niceDay(J.curMonth + '-' + ('0' + b.dueDay).slice(-2));
    else s = (b.auto ? 'AutoPay ' : 'Due ') + niceDay(b.due);
    s += b.auto ? (b.paid ? '' : b.estimate ? ' · so far' : ' · statement') : ' · your half ' + money(b.half);
    h += '<div class="row"><div class="l"><div class="t">' + esc(b.name) + '</div><div class="s">' + esc(s) + '</div></div>' +
      '<div class="a' + (b.paid ? ' paid' : '') + '">' + (b.paid ? ICON_OK : '') + money(b.paid ? b.paidAmt : b.amount) + '</div></div>';
  });
  h += '</div></div></div>';

  // Shared card
  var C = J.card, p = C.budget ? C.spent / C.budget : 0, cst = p > 1 ? 'over' : p >= NEAR_AT ? 'near' : 'ok', left = C.budget - C.spent;
  var tick = t.getDate() / daysIn(t.getFullYear(), t.getMonth());
  h += sec('Shared card', 'Tap to see purchases') + '<div class="group">' +
    '<button class="cat tap" data-joint="card"><div class="top"><div class="nm">Joint card · ' + esc(J.monthName) + '</div>' +
    '<div class="r"><div class="st ' + (cst === 'ok' ? '' : 'c-' + cst) + '">' + money(left) + (left < 0 ? ' over' : ' left') + '</div>' + CHEV + '</div></div>' +
    '<div class="bar"><i class="f-' + cst + '" style="width:' + pctW(p) + '"></i><u style="left:' + pctW(tick) + '"></u></div>' +
    '<div class="bot"><span>' + money(C.spent) + ' of ' + money(C.budget) + ' · your half ' + money(C.half) + '</span><span>' + Math.round(p * 100) + '%</span></div></button></div>' +
    (C.statement != null ? '<div class="note">' + (C.statementOpen ? 'Statement ' + money(C.statement, true) + ' paid by AutoPay ' + niceDay(C.statementDue) + '. ' : '') +
      money(C.unbilled, true) + ' so far goes on the next bill.</div>' : '');

  // Pay back
  if (J.payback && J.payback.length) {
    var pb = J.payback.reduce(function (s, x) { return s - x.amt; }, 0);
    h += sec('Pay back', money(pb, true)) + '<div class="group">';
    J.payback.forEach(function (x) {
      var name = x.name || cleanDesc(x.desc);
      h += '<div class="tx"><div class="av">' + esc((name[0] || '$').toUpperCase()) + '</div><div class="mid"><div class="m">' + esc(name) + '</div>' +
        '<div class="x">' + esc(niceDay(x.iso)) + ' · joint debit</div></div><div class="amt">' + signed(x.amt, true) + '</div></div>';
    });
    h += '</div><div class="note">Fun stuff on the joint debit. Whoever spent it puts it back, then logs it under Settled pay backs on the Joint tab.</div>';
  }

  // Coming up
  if (J.upcoming && J.upcoming.length) {
    h += sec('Upcoming bills', money(J.dueTotal) + ' due by ' + niceDay(J.horizonEnd)) + '<div class="group">';
    J.upcoming.forEach(function (u) {
      h += '<div class="row" style="min-height:58px"><div class="l"><div class="t" style="font-size:16px">' + esc(u.name) + '</div><div class="s">' + (u.late ? 'Not seen yet' : niceDay(u.iso) + (u.estimate ? ' · so far' : u.card ? ' · statement' : '')) + '</div></div><div class="a" style="font-size:16px">' + money(u.amount) + '</div></div>';
    });
    h += '</div><div class="note">Paid from the joint debit, soonest first.</div>';
  }
  return h + '<div class="note">Joint debit numbers update after the Sunday import. Joint card purchases show within minutes.</div>';
}

// ---------------------------------------------------------------- Activity
function parseShort(s) { // "Oct 19" (no year) -> Date, assuming the most recent past occurrence
  var m = /^([A-Za-z]{3})\s+(\d{1,2})$/.exec(String(s).trim()), t = today();
  if (!m) return null;
  var d = new Date(t.getFullYear(), MON.indexOf(m[1]), Number(m[2]));
  if (d > t) d.setFullYear(d.getFullYear() - 1);
  return d;
}
function shortAcct(a) {
  var s = String(a || '').replace(/^CO\s+/, ''), m = /^(.*?)\s*(\d{4})$/.exec(s);
  return m ? m[1].replace('Quicksilver', 'Quicksilver') + ' ··' + m[2] : s;
}
function viewActivity() {
  var L = DATA.live || [], h = head('Card purchases', 'Activity'), t = today();
  if (!L.length) return h + '<div class="msg"><b>No new purchases</b><p>Card and debit purchases show up here within about 5 minutes. They move to your history after the Sunday import.</p></div>';
  var groups = [], byKey = {};
  L.forEach(function (x) {
    if (!byKey[x.date]) { byKey[x.date] = { key: x.date, items: [], total: 0 }; groups.push(byKey[x.date]); }
    byKey[x.date].items.push(x); if (x.amount < 0) byKey[x.date].total += -x.amount;
  });
  groups.forEach(function (g) {
    var d = parseShort(g.key), label = g.key, sub = '';
    if (d) {
      var diff = Math.round((t - d) / 864e5);
      label = diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : diff < 7 ? WEEKDAYS[d.getDay()] : MON[d.getMonth()] + ' ' + d.getDate();
      sub = diff < 7 ? WEEKDAYS[d.getDay()].slice(0, 3) + ', ' + MON[d.getMonth()] + ' ' + d.getDate() : '';
      if (diff >= 2 && diff < 7) sub = MON[d.getMonth()] + ' ' + d.getDate();
    }
    h += '<div class="day"><div class="d"><b>' + esc(label) + '</b><span>' + esc(sub) + '</span></div><div class="tot">' + money(g.total, true) + '</div></div><div class="group">';
    g.items.forEach(function (x) {
      var initial = (String(x.description).replace(/[^A-Za-z0-9]/g, '')[0] || '$').toUpperCase();
      h += '<div class="tx"><div class="av">' + esc(initial) + '</div><div class="mid"><div class="m">' + esc(x.description) + '</div>' +
        '<div class="x">' + esc(x.category || 'Uncategorized') + ' · ' + esc(shortAcct(x.account)) + '</div></div>' +
        '<div class="amt' + (x.amount > 0 ? ' in' : '') + '">' + signed(x.amount, true) + '</div></div>';
    });
    h += '</div>';
  });
  return h + '<div class="note">Live purchases from card alerts. They move to your history after the Sunday import.</div>';
}

// ---------------------------------------------------------------- Trends
function monthFull(lbl) { // "Oct 26" -> {name:"October 2026", y, m}
  var m = /^([A-Za-z]{3})\s+(\d{2})$/.exec(String(lbl).trim());
  if (!m) return { name: lbl, short: lbl, y: 0, m: -1 };
  var mi = MON.indexOf(m[1]), y = 2000 + Number(m[2]);
  return { name: MONTHS[mi] + ' ' + y, short: MON[mi] + ' ' + y, y: y, m: mi };
}
function niceMax(v) { var steps = [1000, 2000, 2500, 5000, 10000, 15000, 20000, 25000, 30000, 40000, 50000, 75000, 100000]; for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i]; return Math.ceil(v / 50000) * 50000; }
function viewTrends() {
  var M = (DATA.monthly || []).map(function (x) { var f = monthFull(x.month); return { label: f.name, short: f.short, y: f.y, m: f.m, inn: x.in, out: x.out, net: x.net }; });
  if (!M.length) return head('', 'Trends') + '<div class="msg"><b>No monthly history yet</b><p>The Monthly tab of the sheet is empty.</p></div>';
  var t = today();
  M.forEach(function (x) { x.partial = x.y === t.getFullYear() && x.m === t.getMonth(); });
  var full = M.filter(function (x) { return !x.partial; }).slice(-12);
  var ai = 0, ao = 0; full.forEach(function (x) { ai += x.inn; ao += x.out; });
  var n = full.length || 1; ai /= n; ao /= n;
  var an = ai - ao, kept = ai > 0 ? Math.round(an / ai * 100) : 0;
  var max = niceMax(Math.max.apply(null, M.map(function (x) { return Math.max(x.inn, x.out); })) || 1);

  var h = head(M[0].short + ' – ' + M[M.length - 1].short, 'Trends');
  h += '<section class="hero" style="padding:22px 20px 18px"><div class="eb">Average month</div>' +
    '<div class="tn"><b class="' + (an < 0 ? 'neg' : '') + '">' + signed(Math.round(an)) + '</b><span>net, ' +
    (an >= 0 ? kept + '% of income kept' : 'spending more than income') + '</span></div>' +
    '<div class="stats"><div><div class="k"><i style="background:var(--hacc)"></i>In</div><div class="v">' + money(ai) + '</div></div>' +
    '<div><div class="k"><i style="background:var(--hout)"></i>Out</div><div class="v">' + money(ao) + '</div></div></div>' +
    '<div class="chart" role="img" aria-label="Money in and out for each of the last ' + M.length + ' months">';
  M.forEach(function (x) {
    h += '<div class="m" style="opacity:' + (x.partial ? 0.4 : 1) + '"><i style="background:var(--hacc);height:' + pctW(x.inn / max) + '"></i><i style="background:var(--hout);height:' + pctW(x.out / max) + '"></i></div>';
  });
  h += '</div><div class="mlab">';
  M.forEach(function (x) { h += '<span>' + (x.m >= 0 ? MONTHS[x.m][0] : '') + '</span>'; });
  h += '</div></section><div class="note">Averages use the last ' + full.length + ' full months.</div>';

  h += sec('By month') + '<div class="group">';
  M.slice().reverse().forEach(function (x) {
    h += '<div class="row"><div class="l"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:16px;font-weight:700">' + esc(x.label) + '</span>' +
      (x.partial ? '<span style="font-size:13px;font-weight:600;color:var(--ink3)">So far</span>' : '') + '</div>' +
      '<div style="font-size:13px;font-weight:600;color:var(--ink2);margin-top:1px">In ' + money(x.inn) + ' · Out ' + money(x.out) + '</div></div>' +
      '<div class="pill ' + (x.net >= 0 ? 'pos' : 'neg') + '">' + signed(Math.round(x.net)) + '</div></div>';
  });
  return h + '</div>';
}

// ---------------------------------------------------------------- Net worth
function niceAsOf(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? 'As of ' + MON[Number(m[2]) - 1] + ' ' + Number(m[3]) : 'As of last update'; }
function viewWorth() {
  var N = DATA.netWorth || {}, A = N.accounts || [];
  var have = A.filter(function (a) { return a.value > 0; }).sort(function (a, b) { return b.value - a.value; });
  var owe = A.filter(function (a) { return a.value < 0; }).sort(function (a, b) { return a.value - b.value; });
  var haveSum = have.reduce(function (s, a) { return s + a.value; }, 0), oweSum = owe.reduce(function (s, a) { return s - a.value; }, 0);
  var nwRow = (N.summary || []).filter(function (s) { return /^net worth/i.test(s.label); })[0];
  var total = nwRow ? nwRow.value : haveSum - oweSum;
  // Composition by account type (Retirement, Stock, Cash...), biggest first, max 4 groups.
  var byType = {}; have.forEach(function (a) { var k = a.type || 'Other'; byType[k] = (byType[k] || 0) + a.value; });
  var comp = Object.keys(byType).map(function (k) { return { name: k, v: byType[k] }; }).sort(function (a, b) { return b.v - a.v; });
  if (comp.length > 4) { var rest = comp.slice(3).reduce(function (s, x) { return s + x.v; }, 0); comp = comp.slice(0, 3).concat([{ name: 'Other', v: rest }]); }
  var colors = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];

  var h = head(niceAsOf(N.asOf), 'Net worth');
  h += '<section class="hero"><div class="eb">All accounts</div><div class="num n' + (total < 0 ? ' neg' : '') + '" style="' + fit(money(total), 76, 7) + '">' + (total < 0 ? '−' : '') + money(total) + '</div>' +
    '<div style="font-size:15px;font-weight:600;color:var(--hink2);margin-top:12px">' + money(haveSum) + ' assets − ' + money(oweSum) + ' owed</div><div class="comp">';
  comp.forEach(function (x, i) { h += '<i style="width:' + pctW(x.v / (haveSum || 1)) + ';background:' + colors[i] + '"></i>'; });
  h += '</div><div class="legend">';
  comp.forEach(function (x, i) { h += '<div><i style="background:' + colors[i] + '"></i><span>' + esc(x.name) + '</span><b>' + Math.round(x.v / (haveSum || 1) * 100) + '%</b></div>'; });
  h += '</div></section>';

  h += sec('What you have', money(haveSum), true) + '<div class="group">';
  have.forEach(function (a) { h += '<div class="row"><div class="l"><div class="t">' + esc(a.account) + '</div><div class="s">' + esc(a.type) + '</div></div><div class="a">' + money(a.value) + '</div></div>'; });
  h += '</div>';
  if (owe.length) {
    h += sec('What you owe', money(oweSum), true) + '<div class="group">';
    owe.forEach(function (a) {
      h += '<div class="row"><div class="l"><div class="t">' + esc(a.account) + '</div><div class="s">' + esc(a.type) +
        (a.share && a.share !== 1 ? ' · your ' + Math.round(a.share * 100) + '% share' : '') + '</div></div><div class="a">' + money(a.value) + '</div></div>';
    });
    h += '</div>';
  }
  if (N.unvested) {
    h += '<div class="sec"><h2 class="muted">Not counted yet</h2></div><div class="group dashed"><div class="row" style="border:0;margin:0"><div class="l">' +
      '<div class="t" style="color:var(--ink2)">' + esc(N.unvested.label) + '</div><div class="s" style="color:var(--ink3)">Unvested stock</div></div>' +
      '<div class="a" style="color:var(--ink2)">' + money(N.unvested.value) + '</div></div></div>' +
      '<div class="note">Added to net worth as each grant vests.</div>';
  }
  return h;
}

// ---------------------------------------------------------------- Purchases sheet
var CHEV = '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5-5 5"/></svg>';
var SHEET = { cat: null, sort: 'new' };
function titleCase(s) { return s.toLowerCase().replace(/(^|[\s\-\/(&])([a-z])/g, function (m, p, c) { return p + c.toUpperCase(); }); }
var US_STATES = 'AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC';
var CITY_STATE = new RegExp(',?\\s+[A-Za-z.]+(?:\\s[A-Za-z.]+)?,?\\s+(?:' + US_STATES + ')(?:\\s+US)?$');
function cleanDesc(raw) {
  var s = String(raw || '').trim();
  s = s.replace(/^(debit|digital)\s+card\s+purchase\s*-\s*/i, '').replace(/^withdrawal from\s+/i, '').replace(/^purchase authorized on \S+\s+/i, '');
  s = s.replace(/^(TST|SQ|SP|PY|DD)\s*\*\s*/i, '');
  s = s.replace(/\*\s*[A-Z0-9]{6,}\b/g, '');                 // order codes: Amazon.com*596B74U82
  s = s.replace(/\s+[A-Z0-9]*\d[A-Z0-9]{5,}\b.*$/, '');       // reference codes and anything after
  s = s.replace(/\s+\d{3}[-\s]?\d{3}[-\s]?\d{4}\b.*$/, '');   // phone numbers and anything after
  s = s.replace(/\s+(#|T-?\s?)\d+.*$/, '');                    // store numbers: #569, T-1422
  s = s.replace(/#\w*\d\w*.*$/, '');                           // ARCO#05369FD GAS
  s = s.replace(CITY_STATE, '');                              // " SEATTLE, WA US"
  s = s.replace(/\s+\d{3,}$/, '').replace(/\s*\*\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (!s) s = String(raw || '').trim();
  return s === s.toUpperCase() ? titleCase(s) : s;
}
function niceDay(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? MON[Number(m[2]) - 1] + ' ' + Number(m[3]) : iso; }
function openSheet(cat) {
  if (!DATA || (cat === JCARD ? !(DATA.joint && DATA.joint.card) : !DATA.txns)) return;
  SHEET.cat = cat; SHEET.sort = 'new'; drawSheet();
  document.body.style.overflow = 'hidden';
  $('sheetBg').classList.add('open'); $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false');
  setTimeout(function () { var c = $('sheetClose'); if (c) c.focus(); }, 300);
}
function closeSheet() {
  document.body.style.overflow = '';
  $('sheetBg').classList.remove('open'); $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true');
  SHEET.cat = null;
}
function drawSheet() {
  var cat = SHEET.cat, isJ = cat === JCARD, J = DATA.joint || {};
  var rows = isJ
    ? ((J.card && J.card.rows) || []).map(function (x) { return { iso: x.iso, desc: x.desc, amt: x.amt, cat: x.cat, acct: 'CO Joint Card 7052', live: x.live }; })
    : (DATA.txns || []).filter(function (t) { return t.cat === cat; });
  rows = rows.slice().sort(SHEET.sort === 'big'
    ? function (a, b) { return a.amt - b.amt; }
    : function (a, b) { return a.iso < b.iso ? 1 : a.iso > b.iso ? -1 : (b.live ? 1 : 0) - (a.live ? 1 : 0); });
  var spent = -rows.reduce(function (s, t) { return s + t.amt; }, 0);
  var capRow = isJ ? { cap: J.card.budget, actual: J.card.spent } : ((DATA.caps || {}).rows || []).filter(function (r) { return r.category === cat; })[0];
  var cap = capRow && capRow.cap > 0 ? capRow.cap : 0;
  var shown = capRow ? capRow.actual : spent;
  var sub = cap ? money(shown) + ' of ' + money(cap) + ' · ' + Math.round(shown / cap * 100) + '%' : money(shown) + ' this month';
  sub += isJ ? ' · your half ' + money(J.card.half) : ' · ' + rows.length + ' purchase' + (rows.length === 1 ? '' : 's');
  var h = '<div class="grab"></div><div class="sh-head" id="sheetHead"><div style="min-width:0"><h3>' + esc(isJ ? 'Joint card' : cat) + '</h3><p>' + esc(sub) + '</p></div>' +
    '<button class="tool" id="sheetClose" aria-label="Close">✕</button></div>';
  if (cap) {
    var st = shown > cap ? 'over' : shown >= NEAR_AT * cap ? 'near' : 'ok', t = today();
    h += '<div class="sh-bar cat" style="padding:0;border:0;margin-bottom:0"><div class="bar"><i class="f-' + st + '" style="width:' + pctW(shown / cap) + '"></i><u style="left:' + pctW(t.getDate() / daysIn(t.getFullYear(), t.getMonth())) + ';box-shadow:0 0 0 2px var(--bg)"></u></div></div>';
  }
  h += '<div class="seg" role="group" aria-label="Sort"><button data-sort="new" aria-pressed="' + (SHEET.sort === 'new') + '">Newest</button><button data-sort="big" aria-pressed="' + (SHEET.sort === 'big') + '">Biggest</button></div>';
  h += '<div class="sh-body">';
  if (!rows.length) h += '<div class="group"><div class="empty">No purchases ' + (isJ ? 'on the joint card' : 'in ' + esc(cat)) + ' yet this month.</div></div>';
  else {
    h += '<div class="group">';
    rows.forEach(function (x) {
      var name = cleanDesc(x.desc), initial = (name.replace(/[^A-Za-z0-9]/g, '')[0] || '$').toUpperCase();
      h += '<div class="tx"><div class="av">' + esc(initial) + '</div><div class="mid"><div class="m">' + esc(name) + '</div>' +
        '<div class="x">' + esc(niceDay(x.iso)) + ' · ' + esc(isJ ? (x.cat || 'Uncategorized') : shortAcct(x.acct)) + (x.live ? '<span class="tag">Pending</span>' : '') + '</div></div>' +
        '<div class="amt' + (x.amt > 0 ? ' in' : '') + '">' + signed(x.amt, true) + '</div></div>';
    });
    h += '</div><div class="note">Pending = from a card alert, not yet in your bank history.</div>';
  }
  h += '</div>';
  $('sheet').innerHTML = h;
  $('sheetClose').onclick = closeSheet;
  Array.prototype.forEach.call($('sheet').querySelectorAll('.seg button'), function (b) {
    b.onclick = function () { SHEET.sort = b.getAttribute('data-sort'); drawSheet(); };
  });
  // Swipe down on the header to close.
  var head = $('sheetHead'), y0 = null;
  head.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });
  head.addEventListener('touchmove', function (e) { if (y0 !== null && e.touches[0].clientY - y0 > 70) { y0 = null; closeSheet(); } }, { passive: true });
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && SHEET.cat) closeSheet(); });

// ---------------------------------------------------------------- Shell
function longDate(d) { return WEEKDAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function fit(str, base, chars) { // shrink hero numbers so long amounts stay on one line at 390pt
  var n = String(str).length;
  return 'font-size:' + (n > chars ? Math.max(44, Math.floor(base * chars / n)) : base) + 'px';
}
function sec(title, right, strong) { return '<div class="sec"><h2>' + esc(title) + '</h2>' + (right ? '<span class="' + (strong ? 'strong' : '') + '">' + esc(right) + '</span>' : '') + '</div>'; }
var ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>';
var THEME_ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};
var THEMES = ['auto', 'light', 'dark'], THEME_NAMES = { auto: 'Theme: Auto', light: 'Theme: Light', dark: 'Theme: Dark' }, THEME = 'auto';
function head(eyebrow, title) {
  return '<div class="head"><div><div class="eyebrow">' + esc(eyebrow || ' ') + '</div><h1>' + esc(title) + '</h1></div>' +
    '<div class="tools"><button class="tool" id="themeBtn" aria-label="' + THEME_NAMES[THEME] + '. Tap to change.">' + THEME_ICONS[THEME] + '</button>' +
    '<button class="tool' + (LOADING ? ' spin' : '') + '" id="refreshBtn" aria-label="Refresh">' + ICON_REFRESH + '</button></div></div>';
}
function tipHtml() {
  var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var off = false; try { off = localStorage.getItem('tipOff') === '1'; } catch (e) {}
  return (!standalone && !off && !window.SAMPLE) ? '<div class="tip" id="tip"><span>Tap <b>Share</b>, then <b>Add to Home Screen</b> to open this like an app.</span><button id="tipx" aria-label="Dismiss">×</button></div>' : '';
}
function render() {
  var fn = { budget: viewBudget, home: viewHome, activity: viewActivity, trends: viewTrends, worth: viewWorth }[TAB];
  var html;
  try { html = fn(); } catch (e) { html = head('', 'Finance') + '<div class="msg"><b>This screen could not draw.</b><p>' + esc(e.message) + '</p></div>'; }
  html = html.replace('</div></div>', '</div></div>' + tipHtml()); // tip goes right under the header
  html += '<div class="note" style="text-align:center;padding-top:26px">Updated ' + esc(DATA.generatedAt || 'just now') + ' · tap ↻ to refresh</div>';
  $('screen').innerHTML = html;
  wire();
  if (SHEET.cat) drawSheet();
}
function shell(eyebrow, title, body) { $('screen').innerHTML = head(eyebrow, title) + body; wire(); }
function wire() {
  var tb = $('themeBtn'), rb = $('refreshBtn'), tx = $('tipx');
  if (tb) tb.onclick = function () { applyTheme(THEMES[(THEMES.indexOf(THEME) + 1) % 3], true); };
  if (rb) rb.onclick = load;
  if (tx) tx.onclick = function () { try { localStorage.setItem('tipOff', '1'); } catch (e) {} $('tip').remove(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function (b) { b.onclick = function () { openSheet(b.getAttribute('data-cat')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-joint]'), function (b) { b.onclick = function () { openSheet(JCARD); }; });
  var bb = $('billsBtn');
  if (bb) bb.onclick = function () {
    BILLS_OPEN = !BILLS_OPEN;
    $('billsAcc').classList.toggle('open', BILLS_OPEN); bb.setAttribute('aria-expanded', String(BILLS_OPEN));
    try { localStorage.setItem('billsOpen', BILLS_OPEN ? '1' : '0'); } catch (e) {}
  };
  var mb = $('myBillsBtn');
  if (mb) mb.onclick = function () {
    MYBILLS_OPEN = !MYBILLS_OPEN;
    $('myBillsAcc').classList.toggle('open', MYBILLS_OPEN); mb.setAttribute('aria-expanded', String(MYBILLS_OPEN));
    try { localStorage.setItem('myBillsOpen', MYBILLS_OPEN ? '1' : '0'); } catch (e) {}
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-goto]'), function (b) { b.onclick = function () { goTab(b.getAttribute('data-goto')); }; });
}
function applyTheme(t, announce) {
  THEME = THEMES.indexOf(t) >= 0 ? t : 'auto';
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('theme', THEME); } catch (e) {}
  var b = $('themeBtn'); if (b) { b.innerHTML = THEME_ICONS[THEME]; b.setAttribute('aria-label', THEME_NAMES[THEME] + '. Tap to change.'); }
  if (announce) { var el = $('toast'); el.textContent = THEME_NAMES[THEME]; el.classList.add('show'); clearTimeout(applyTheme.t); applyTheme.t = setTimeout(function () { el.classList.remove('show'); }, 1400); }
}

// ---------------------------------------------------------------- Data
function getKey() {
  var m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { try { localStorage.setItem('k', m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem('k') || ''; } catch (e) { return ''; }
}
function setSpin(on) { LOADING = on; var rb = $('refreshBtn'); if (rb) rb.classList.toggle('spin', on); }
function showError(err) {
  setSpin(false);
  if (DATA) { var el = $('toast'); el.textContent = 'Could not refresh. Showing the last numbers.'; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 2200); return; }
  shell('', 'Finance', '<div class="msg"><b>Could not load your numbers</b><p>' + esc(err && err.message || err) + '</p><button id="retry">Try again</button></div>');
  $('retry').onclick = load;
}
function load() {
  if (window.SAMPLE) { setSpin(true); setTimeout(function () { DATA = window.SAMPLE; setSpin(false); render(); }, 250); return; }
  var key = getKey();
  if (!key) { shell('Setup', 'Finance', '<div class="msg"><b>This phone is not set up yet</b><p>Open the "Finance app setup link" email on this phone and tap the link. Then tap Share and Add to Home Screen.</p></div>'); return; }
  setSpin(true);
  // POST as text/plain keeps the key out of the URL and avoids a CORS preflight.
  fetch(API, { method: 'POST', body: JSON.stringify({ key: key }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.error === 'unauthorized') throw new Error('This setup link no longer works. Open the newest "Finance app setup link" email.');
      if (d && d.error) throw new Error(d.error);
      DATA = d; setSpin(false); render();
    })
    .catch(showError);
}

function goTab(name) {
  TAB = name;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.setAttribute('aria-selected', x.getAttribute('data-tab') === name ? 'true' : 'false'); });
  window.scrollTo(0, 0);
  if (DATA) render();
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () { goTab(b.getAttribute('data-tab')); };
});
$('sheetBg').onclick = closeSheet;
// Refresh when the app comes back to the foreground after a while.
var hiddenAt = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 60000) load();
});
// Block pinch zoom, so it behaves like an app (Safari ignores user-scalable=no on its own).
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
try { THEME = localStorage.getItem('theme') || 'auto'; } catch (e) {}
applyTheme(THEME, false);
load();
</script>
</body>
</html>
