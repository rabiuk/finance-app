<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: iOS-style app shell. Large title, grouped lists, fixed tab bar. One view per tab. */
:root {
  --bg: #f2f3f7;
  --card: #ffffff;
  --fill: #e9ebf1;
  --text: #0f1219;
  --dim: #6a7183;
  --faint: #a3a9b8;
  --line: #e3e6ed;
  --accent: #3b4fd8;
  --accent-soft: #e8ebfd;
  --ok: #1f9d5b;
  --warn: #d98a00;
  --bad: #e0392f;
  --bad-soft: #fde9e8;
  --warn-soft: #fdf2dc;
  --ok-soft: #e3f5ea;
  --bar-blur: rgba(242, 243, 247, .82);
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #16171c; --fill: #24262e; --text: #f3f4f8; --dim: #9198a8;
    --faint: #5d6372; --line: #26282f; --accent: #8593ff; --accent-soft: #1d2147;
    --ok: #35c27a; --warn: #f0a52a; --bad: #ff5b4f; --bad-soft: #3a1513;
    --warn-soft: #3a2a0c; --ok-soft: #0f2e1d; --bar-blur: rgba(10, 10, 12, .82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #000000; --card: #16171c; --fill: #24262e; --text: #f3f4f8; --dim: #9198a8;
    --faint: #5d6372; --line: #26282f; --accent: #8593ff; --accent-soft: #1d2147;
    --ok: #35c27a; --warn: #f0a52a; --bad: #ff5b4f; --bad-soft: #3a1513;
    --warn-soft: #3a2a0c; --ok-soft: #0f2e1d; --bar-blur: rgba(10, 10, 12, .82);
    color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  font-variant-numeric: tabular-nums;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }
h1 { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.refresh {
  border: 0; background: var(--fill); color: var(--text); width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.refresh svg { width: 18px; height: 18px; }
.actions { display: flex; gap: 8px; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; background: var(--text); color: var(--bg); font: 600 13px var(--body); padding: 8px 14px; border-radius: 99px; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 6; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero */
.hero { background: var(--card); border-radius: 20px; padding: 18px 18px 16px; margin-bottom: 12px; }
.hero .label { font-size: 13px; color: var(--dim); font-weight: 600; }
.hero .big { font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; margin-top: 4px; }
.hero .big.neg { color: var(--bad); }
.hero .sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
.hero .meter { margin-top: 14px; }
.chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.bad i { background: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.warn i { background: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.ok i { background: var(--ok); }

/* Meter with a pace tick */
.track { position: relative; height: 8px; border-radius: 99px; background: var(--fill); }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.track .fill.warn { background: var(--warn); } .track .fill.bad { background: var(--bad); }
.track .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--text); opacity: .35; }
.legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }

/* Grouped list */
.section { font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 8px; display: flex; justify-content: space-between; }
.section span:last-child { text-transform: none; letter-spacing: 0; font-weight: 500; }
.group { background: var(--card); border-radius: 16px; overflow: hidden; }
.item { padding: 13px 16px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.name { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.val { font-weight: 600; white-space: nowrap; }
.val small { color: var(--dim); font-weight: 500; font-size: 13px; }
.meta { font-size: 13px; color: var(--dim); margin-top: 3px; }
.meta.bad { color: var(--bad); font-weight: 600; } .meta.warn { color: var(--warn); font-weight: 600; }
.item .track { margin-top: 9px; height: 6px; }

/* Activity */
.tx { display: flex; gap: 12px; align-items: center; }
.ico { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; font-family: var(--display); }
.tx .mid { flex: 1; min-width: 0; }
.tx .amt { font-weight: 600; white-space: nowrap; }
.tx .amt.in { color: var(--ok); }

/* Trends */
.chart { background: var(--card); border-radius: 16px; padding: 16px 12px 10px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.keys { display: flex; gap: 14px; font-size: 12px; color: var(--dim); padding: 0 6px 10px; }
.keys b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--dim); font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 19px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.pos { color: var(--ok); } .negc { color: var(--bad); }

/* Net worth */
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: 14px; }
.stack span { display: block; height: 100%; }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bar-blur); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; font: 600 11px var(--body); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab:focus-visible, .refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* States */
.sk { background: var(--card); border-radius: 16px; height: 64px; margin-bottom: 10px; position: relative; overflow: hidden; }
.sk.tall { height: 150px; border-radius: 20px; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--fill), transparent); transform: translateX(-100%); animation: sh 1.2s infinite; opacity: .6; }
@keyframes sh { to { transform: translateX(100%); } }
.err { background: var(--card); border-radius: 16px; padding: 18px; }
.err b { display: block; margin-bottom: 4px; }
.err button { margin-top: 12px; border: 0; background: var(--accent); color: #fff; font: 600 15px var(--body); padding: 10px 16px; border-radius: 12px; }
.empty { padding: 16px; color: var(--dim); font-size: 14px; }
.tip { background: var(--accent-soft); color: var(--text); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
.tip button { margin-left: auto; border: 0; background: none; color: var(--dim); font: 600 18px var(--body); line-height: 1; cursor: pointer; }
.foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 22px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Loading…</div>
      <h1 id="title">Budget</h1>
    </div>
    <div class="actions">
    <button class="refresh" id="theme" aria-label="Theme"></button>
    <button class="refresh" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    </div>
  </header>
  <main id="view">
    <div class="sk tall"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </main>
  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button class="tab" role="tab" data-tab="budget" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg>Budget</button>
    <button class="tab" role="tab" data-tab="activity" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</button>
    <button class="tab" role="tab" data-tab="trends" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>Trends</button>
    <button class="tab" role="tab" data-tab="worth" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20v-8l7-6 7 6v8"/><path d="M10 20v-5h4v5"/></svg>Net worth</button>
  </div>
</nav>

<script>
var DATA = null, TAB = 'budget';
var TITLES = { budget: 'Budget', activity: 'Activity', trends: 'Trends', worth: 'Net worth' };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(n, cents) {
  var v = Number(n) || 0, a = Math.abs(v);
  var s = a.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return (v < 0 ? '−$' : '$') + s;
}
function compact(n) {
  var a = Math.abs(n);
  if (a >= 1000) return (n < 0 ? '−' : '') + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k';
  return money(n);
}
function stateOf(r) { if (!(r.cap > 0)) return 'none'; if (r.actual > r.cap) return 'bad'; if (r.pct >= 0.8) return 'warn'; return 'ok'; }
function meter(pct, pace, cls) {
  var w = Math.max(0, Math.min(100, Math.round(pct * 100)));
  var p = Math.max(0, Math.min(100, pace));
  return '<div class="track"><div class="fill ' + (cls || '') + '" style="width:' + w + '%"></div>' +
    '<div class="pace" style="left:calc(' + p + '% - 1px)"></div></div>';
}
function daysInfo() {
  var c = DATA.caps, parts = (c.month || '').split('-').map(Number);
  var dim = parts.length === 2 ? new Date(parts[0], parts[1], 0).getDate() : 30;
  var day = Math.max(1, Math.round(c.monthGonePct / 100 * dim));
  return { dim: dim, day: day, left: Math.max(0, dim - day), monthName: (c.monthLabel || '').split(' ')[0] };
}

// ---------------------------------------------------------------- Budget
function viewBudget() {
  var c = DATA.caps, d = daysInfo();
  var capped = c.rows.filter(function (r) { return r.cap > 0; });
  var flex = capped.filter(function (r) { return !/joint/i.test(r.category); });
  var fixed = capped.filter(function (r) { return /joint/i.test(r.category); });
  var none = c.rows.filter(function (r) { return !(r.cap > 0) && Math.abs(r.actual) >= 0.5; });

  var spent = flex.reduce(function (s, r) { return s + r.actual; }, 0);
  var cap = flex.reduce(function (s, r) { return s + r.cap; }, 0);
  var left = cap - spent;
  var perDay = d.left > 0 && left > 0 ? left / d.left : 0;
  var over = flex.filter(function (r) { return stateOf(r) === 'bad'; }).length;
  var near = flex.filter(function (r) { return stateOf(r) === 'warn'; }).length;
  var fine = flex.length - over - near;

  var h = '<section class="hero">' +
    '<div class="label">' + (left >= 0 ? 'Left in your caps' : 'Over your caps') + '</div>' +
    '<div class="big' + (left < 0 ? ' neg' : '') + '">' + money(Math.abs(left)) + '</div>' +
    '<div class="sub">' + money(spent) + ' of ' + money(cap) + ' spent' +
    (perDay ? ' · about ' + money(perDay) + ' a day' : '') + '</div>' +
    '<div class="meter">' + meter(cap ? spent / cap : 0, c.monthGonePct, left < 0 ? 'bad' : (spent / cap > c.monthGonePct / 100 + 0.1 ? 'warn' : '')) + '</div>' +
    '<div class="legend"><span>Spent</span><span>Tick = ' + c.monthGonePct + '% of month gone</span></div>' +
    '<div class="chips">' +
    (over ? '<span class="chip bad"><i></i>' + over + ' over</span>' : '') +
    (near ? '<span class="chip warn"><i></i>' + near + ' near</span>' : '') +
    '<span class="chip ok"><i></i>' + fine + ' on track</span></div></section>';

  var order = { bad: 0, warn: 1, ok: 2 };
  flex.sort(function (a, b) { return order[stateOf(a)] - order[stateOf(b)] || b.pct - a.pct; });
  h += '<div class="section"><span>Categories</span><span>' + d.left + ' days left</span></div><div class="group">';
  flex.forEach(function (r) { h += capRow(r, c.monthGonePct); });
  h += '</div>';

  if (fixed.length) {
    h += '<div class="section"><span>Fixed</span><span></span></div><div class="group">';
    fixed.forEach(function (r) { h += capRow(r, c.monthGonePct); });
    h += '</div>';
  }
  if (none.length) {
    none.sort(function (a, b) { return b.actual - a.actual; });
    h += '<div class="section"><span>No cap</span><span></span></div><div class="group">';
    none.forEach(function (r) {
      h += '<div class="item"><div class="row"><div class="name">' + esc(r.category) + '</div><div class="val">' + money(r.actual) + '</div></div></div>';
    });
    h += '</div>';
  }
  return h;
}
function capRow(r, pace) {
  var s = stateOf(r), meta;
  if (s === 'bad') meta = '<div class="meta bad">' + money(r.actual - r.cap) + ' over</div>';
  else if (s === 'warn') meta = '<div class="meta warn">' + money(r.cap - r.actual) + ' left · ' + Math.round(r.pct * 100) + '%</div>';
  else meta = '<div class="meta">' + money(r.cap - r.actual) + ' left</div>';
  return '<div class="item"><div class="row"><div class="name">' + esc(r.category) + '</div>' +
    '<div class="val">' + money(r.actual) + ' <small>/ ' + money(r.cap) + '</small></div></div>' +
    meta + meter(r.pct, pace, s === 'ok' ? '' : s) + '</div>';
}

// ---------------------------------------------------------------- Activity
function viewActivity() {
  var L = DATA.live || [];
  if (!L.length) return '<div class="group"><div class="empty">No recent purchases. New card and debit purchases show up here within about 5 minutes.</div></div>';
  var h = '', last = null;
  L.forEach(function (t) {
    if (t.date !== last) {
      if (last !== null) h += '</div>';
      h += '<div class="section"><span>' + esc(t.date) + '</span><span></span></div><div class="group">';
      last = t.date;
    }
    var letter = (String(t.description).replace(/[^A-Za-z0-9]/g, '')[0] || '$').toUpperCase();
    h += '<div class="item tx"><div class="ico">' + esc(letter) + '</div><div class="mid">' +
      '<div class="name">' + esc(t.description) + '</div>' +
      '<div class="meta">' + esc(t.category || 'Uncategorized') + ' · ' + esc(shortAcct(t.account)) + '</div></div>' +
      '<div class="amt' + (t.amount > 0 ? ' in' : '') + '">' + (t.amount > 0 ? '+' : '') + money(t.amount, true) + '</div></div>';
  });
  h += '</div><p class="foot" style="margin-top:12px">Live purchases from card alerts. They move to your history after the Monday import.</p>';
  return h;
}
function niceDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return s || 'last update';
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1] + ' ' + Number(m[3]);
}
function shortAcct(a) { return String(a || '').replace(/^CO\s+/, '').replace(/Quicksilver/, 'Card'); }

// ---------------------------------------------------------------- Trends
function viewTrends() {
  var M = DATA.monthly || [];
  if (!M.length) return '<div class="group"><div class="empty">No monthly history found.</div></div>';
  var W = 340, H = 170, top = 10, bottom = 22, n = M.length, gw = W / n, bw = Math.max(3, gw * 0.32);
  var max = Math.max.apply(null, M.map(function (m) { return Math.max(m.in, m.out); })) || 1;
  var y = function (v) { return top + (H - top - bottom) * (1 - v / max); };
  var grid = '', bars = '', labels = '';
  [0.5, 1].forEach(function (f) {
    var gy = y(max * f);
    grid += '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + W + '" y="' + (gy - 3) + '" text-anchor="end" font-size="9" fill="var(--faint)">' + compact(max * f) + '</text>';
  });
  M.forEach(function (m, i) {
    var cx = gw * i + gw / 2;
    bars += '<rect x="' + (cx - bw - 1) + '" y="' + y(m.in) + '" width="' + bw + '" height="' + (y(0) - y(m.in)) + '" rx="2" fill="var(--ok)" opacity=".85"/>';
    bars += '<rect x="' + (cx + 1) + '" y="' + y(m.out) + '" width="' + bw + '" height="' + (y(0) - y(m.out)) + '" rx="2" fill="var(--accent)"/>';
    if (i % 2 === (n - 1) % 2) labels += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="var(--dim)">' + esc(String(m.month).split(' ')[0]) + '</text>';
  });
  var tin = 0, tout = 0; M.forEach(function (m) { tin += m.in; tout += m.out; });
  var h = '<div class="chart"><div class="keys"><span><b style="background:var(--ok)"></b>Money in</span><span><b style="background:var(--accent)"></b>Money out</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Money in and out by month">' + grid +
    '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)"/>' + bars + labels + '</svg></div>';
  h += '<div class="stats">' +
    '<div class="stat"><div class="k">Avg in</div><div class="v">' + compact(tin / n) + '</div></div>' +
    '<div class="stat"><div class="k">Avg out</div><div class="v">' + compact(tout / n) + '</div></div>' +
    '<div class="stat"><div class="k">Net, ' + n + ' mo</div><div class="v ' + (tin - tout >= 0 ? 'pos' : 'negc') + '">' + compact(tin - tout) + '</div></div></div>';
  h += '<div class="section"><span>By month</span><span>Net</span></div><div class="group">';
  M.slice().reverse().forEach(function (m) {
    h += '<div class="item"><div class="row"><div class="name">' + esc(m.month) + '</div><div class="val ' + (m.net >= 0 ? 'pos' : 'negc') + '">' + (m.net > 0 ? '+' : '') + money(m.net) + '</div></div>' +
      '<div class="meta">' + money(m.in) + ' in · ' + money(m.out) + ' out</div></div>';
  });
  return h + '</div>';
}

// ---------------------------------------------------------------- Net worth
var PALETTE = ['var(--accent)', 'var(--ok)', 'var(--warn)', '#8e6be0', '#2aa7b8', '#c4589b', '#7d8597'];
function viewWorth() {
  var N = DATA.netWorth || {}, A = N.accounts || [];
  var nwRow = (N.summary || []).filter(function (s) { return /^net worth/i.test(s.label); })[0];
  var total = nwRow ? nwRow.value : A.reduce(function (s, a) { return s + a.value; }, 0);
  var assets = A.filter(function (a) { return a.value > 0; }).sort(function (a, b) { return b.value - a.value; });
  var debts = A.filter(function (a) { return a.value < 0; });
  var assetSum = assets.reduce(function (s, a) { return s + a.value; }, 0) || 1;

  var h = '<section class="hero"><div class="label">Net worth</div><div class="big">' + money(total) + '</div>' +
    '<div class="sub">Balances as of ' + esc(niceDate(N.asOf)) + '</div><div class="stack">';
  assets.forEach(function (a, i) { h += '<span style="width:' + (a.value / assetSum * 100) + '%;background:' + PALETTE[i % PALETTE.length] + '"></span>'; });
  h += '</div></section>';

  h += '<div class="section"><span>What you have</span><span></span></div><div class="group">';
  assets.forEach(function (a, i) {
    h += '<div class="item tx"><div class="ico" style="background:transparent;width:12px;height:12px;border-radius:4px;background:' + PALETTE[i % PALETTE.length] + '"></div><div class="mid">' +
      '<div class="name">' + esc(a.account) + '</div><div class="meta">' + esc(a.type) + ' · ' + Math.round(a.value / assetSum * 100) + '%</div></div>' +
      '<div class="amt">' + money(a.value) + '</div></div>';
  });
  h += '</div>';
  if (debts.length) {
    h += '<div class="section"><span>What you owe</span><span></span></div><div class="group">';
    debts.forEach(function (a) {
      h += '<div class="item"><div class="row"><div class="name">' + esc(a.account) + '</div><div class="val negc">' + money(a.value) + '</div></div>' +
        '<div class="meta">' + esc(a.type) + (a.share && a.share !== 1 ? ' · your share ' + Math.round(a.share * 100) + '%' : '') + '</div></div>';
    });
    h += '</div>';
  }
  if (N.unvested) {
    h += '<div class="section"><span>Not counted yet</span><span></span></div><div class="group"><div class="item"><div class="row"><div class="name">' +
      esc(N.unvested.label) + '</div><div class="val" style="color:var(--dim)">' + money(N.unvested.value) + '</div></div></div></div>';
  }
  return h;
}

// ---------------------------------------------------------------- Shell
function render() {
  var d = daysInfo();
  $('eyebrow').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('title').textContent = TITLES[TAB];
  var fn = { budget: viewBudget, activity: viewActivity, trends: viewTrends, worth: viewWorth }[TAB];
  var tip = '';
  var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var tipOff = false; try { tipOff = localStorage.getItem('tipOff') === '1'; } catch (e) {}
  if (!standalone && !tipOff && !window.SAMPLE) tip = '<div class="tip" id="tip"><span>Tap <b>Share</b>, then <b>Add to Home Screen</b> to open this like an app.</span><button id="tipx" aria-label="Dismiss">&times;</button></div>';
  try { $('view').innerHTML = tip + fn(); }
  catch (e) { $('view').innerHTML = '<div class="err"><b>This section could not draw.</b>' + esc(e.message) + '</div>'; }
  $('foot').textContent = 'Read live from Finance Tracker · ' + (DATA.generatedAt || '');
  if ($('tipx')) $('tipx').onclick = function () { try { localStorage.setItem('tipOff', '1'); } catch (e) {} $('tip').remove(); };
}
function showError(err) {
  $('refresh').classList.remove('spin');
  $('eyebrow').textContent = 'Not loaded';
  $('view').innerHTML = '<div class="err"><b>Could not read the sheet.</b>' + esc(err && err.message || err) +
    '<br><button id="retry">Try again</button></div>';
  $('retry').onclick = load;
}
// ---------------------------------------------------------------- Data
// The page holds no data. It asks the Finance dashboard Apps Script for it, with the
// private key from the setup link. The key lives in this page's address (#k=...) and
// in this phone's storage. It never goes in the page code.
var API = 'https://script.google.com/macros/s/AKfycbzSezKO-7wbXo6rw5nBoRfAnb45brEdhQOEAmGll3vVWLUXfkO2bxgfmyWYia8Yjp3U/exec';
function getKey() {
  var m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { try { localStorage.setItem('k', m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem('k') || ''; } catch (e) { return ''; }
}
function showSetup() {
  $('refresh').classList.remove('spin');
  $('eyebrow').textContent = 'Setup';
  $('title').textContent = 'Finance';
  $('view').innerHTML = '<div class="err"><b>This phone is not set up yet.</b>Open the setup link from the "Finance app setup link" email on this phone. Then tap Share and Add to Home Screen.</div>';
}
function load() {
  var ok = function (d) { DATA = d; $('refresh').classList.remove('spin'); render(); };
  if (window.SAMPLE) { $('refresh').classList.add('spin'); setTimeout(function () { ok(window.SAMPLE); }, 300); return; }
  var key = getKey();
  if (!key) { showSetup(); return; }
  $('refresh').classList.add('spin');
  // POST as text/plain keeps the key out of the URL and avoids a CORS preflight.
  fetch(API, { method: 'POST', body: JSON.stringify({ key: key }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.error === 'unauthorized') throw new Error('This setup link no longer works. Open the newest "Finance app setup link" email.');
      if (d && d.error) throw new Error(d.error);
      ok(d);
    })
    .catch(showError);
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
  b.onclick = function () {
    TAB = b.getAttribute('data-tab');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    window.scrollTo(0, 0);
    if (DATA) render();
  };
});
// ---------------------------------------------------------------- Theme: Auto (follows the phone), Light, Dark
var THEMES = ['auto', 'light', 'dark'], THEME = 'auto', toastTimer = null;
var THEME_NAMES = { auto: 'Auto (matches your phone)', light: 'Light mode', dark: 'Dark mode' };
var THEME_ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};
function applyTheme(t, announce) {
  THEME = THEMES.indexOf(t) >= 0 ? t : 'auto';
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', THEME);
  var b = $('theme');
  b.innerHTML = THEME_ICONS[THEME];
  b.setAttribute('aria-label', 'Theme: ' + THEME_NAMES[THEME] + '. Tap to change.');
  try { localStorage.setItem('theme', THEME); } catch (e) {}
  if (announce) {
    var t2 = $('toast'); t2.textContent = THEME_NAMES[THEME]; t2.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t2.classList.remove('show'); }, 1400);
  }
}
try { THEME = localStorage.getItem('theme') || 'auto'; } catch (e) {}
applyTheme(THEME, false);
$('theme').onclick = function () { applyTheme(THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length], true); };

$('refresh').onclick = load;
load();
</script>
</body>
